# Runs the evaluation set against the Gemini API and captures the README
# screenshots. Started manually; needs the GEMINI_API_KEY repository secret.
# The report and the screenshots are uploaded as an artifact and, when
# "publish" is checked, committed to eval/results/<date>[-<label>]/ and
# docs/images/. On the free tier, plan one run per day: a run embeds about
# 550 texts and sends about 115 generation requests (see docs/evaluation.md).
name: Evaluate with Gemini

on:
  workflow_dispatch:
    inputs:
      answer_retrievers:
        description: Retrievers used for the answer evaluation
        type: choice
        options: ["semantic", "semantic,bm25", "semantic,bm25,hybrid"]
        default: semantic
      delay:
        description: Seconds between model calls (free-tier rate limits)
        type: choice
        options: ["0", "2", "4", "8"]
        default: "4"
      screenshots:
        description: Capture the README screenshots
        type: boolean
        default: true
      publish:
        description: Commit the report and the screenshots to the repository
        type: boolean
        default: true
      label:
        description: Suffix of the results folder, for example prompt-v2 (optional)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # only used by the "Publish" step
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[ui,dev]"
      - name: Run the evaluation
        id: evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANSWER_RETRIEVERS: ${{ inputs.answer_retrievers }}
          DELAY: ${{ inputs.delay }}
          MAX_RETRIES: "6"  # per-minute rate limits: wait and retry; a used-up daily quota stops the run
          PYTHONUNBUFFERED: "1"
        run: |
          bash scripts/annotate_failure.sh "Evaluation failed" \
            knowledge-assistant evaluate --answer-retrievers "$ANSWER_RETRIEVERS" \
            --delay "$DELAY" --output eval/results/latest
      - name: Capture the screenshots
        id: screenshots
        if: ${{ inputs.screenshots }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_RETRIES: "6"
          PYTHONUNBUFFERED: "1"
        run: |
          pip install playwright==1.64.0
          playwright install --with-deps chromium
          bash scripts/annotate_failure.sh "Screenshots failed" \
            python scripts/capture_screenshots.py --output docs/images
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-run-${{ github.run_number }}
          path: |
            eval/results/latest
            docs/images
          if-no-files-found: warn
      - name: Publish the results to the repository
        # Also when the screenshots failed: the report is still worth keeping.
        # The screenshots are only committed when all of them were captured.
        if: ${{ !cancelled() && inputs.publish && steps.evaluation.outcome == 'success' }}
        env:
          AUTHOR_NAME: Thierry Daconceição Alvares
          AUTHOR_EMAIL: 91541305+Thierry-Daconceicao-Alvares@users.noreply.github.com
          LABEL: ${{ inputs.label }}
          SCREENSHOTS: ${{ steps.screenshots.outcome }}
        run: |
          folder=$(date -u +%F)
          label=$(printf '%s' "$LABEL" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')
          if [ -n "$label" ]; then folder="$folder-$label"; fi
          mkdir -p "eval/results/$folder"
          cp eval/results/latest/report.md eval/results/latest/results.json "eval/results/$folder/"
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add "eval/results/$folder"
          if [ "$SCREENSHOTS" = "success" ]; then git add docs/images; fi
          git commit -m "Add the evaluation results of $folder"
          git pull --rebase origin main
          git push origin HEAD:main
