name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[ui,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (offline, no API key)
        run: pytest
      - name: Retrieval baseline on the evaluation set (BM25, offline)
        env:
          EMBEDDING_PROVIDER: local
        run: knowledge-assistant evaluate --retrieval-only --retrievers bm25 --output /tmp/eval

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t knowledge-assistant .
      - name: Start the container and check its health endpoint
        run: |
          docker run -d --name assistant -p 8501:8501 -e EMBEDDING_PROVIDER=local knowledge-assistant
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then echo; break; fi
            sleep 2
          done
          curl -sf http://localhost:8501/_stcore/health
          docker logs assistant
