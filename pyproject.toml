[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-assistant"
version = "1.0.0"
description = "Retrieval-augmented assistant that answers questions from company documents (PDF, DOCX, TXT) with page-level citations, abstains when the evidence is missing, and is measured on a labelled evaluation set."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thierry Daconceição Alvares" }]
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.146.0",
    "google-genai==2.31.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "pypdfium2==5.14.0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "rank-bm25==0.2.2",
    "snowballstemmer==3.1.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
ui = ["streamlit==1.66.0"]
dev = ["fpdf2==2.8.9", "httpx2==2.14.0", "pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
knowledge-assistant = "knowledge_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:chromadb.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
